[project]
name = "construction-intelligence"
version = "0.1.0"
description = "AI-powered Construction Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "diskcache>=5.6.3",
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "orjson>=3.11.9",
    "osmium>=4.3.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "selectolax>=0.4.11",
    "shapely>=2.1.2",
    "tenacity>=9.1.4",
    "trafilatura>=2.1.0",
    "typer>=0.27.0",
    "pypdf>=6.14.2",
    "feedparser>=6.0.14",
    "pyproj>=3.7.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construction_intelligence"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
